.record-page,.records-page,.review-page{padding-bottom:90px}
.record-form{max-width:900px;margin:auto;display:grid;gap:16px}
.record-step{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:26px}
.record-step>span{font-size:10px;font-weight:900;letter-spacing:.14em;color:var(--good)}
.record-step h2{font-size:clamp(1.8rem,4vw,2.8rem);margin:8px 0 20px;letter-spacing:-.04em}
.record-step input,.record-step select,.record-step textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:13px 14px;color:var(--ink);outline:none}
.record-step textarea{resize:vertical;min-height:120px;margin-top:12px}
.record-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.upload-box{display:grid;gap:8px;border:1.5px dashed #9eaa9f;border-radius:20px;padding:22px;background:var(--paper);cursor:pointer}
.upload-box input{display:none}
.upload-box strong{font-size:1.1rem}.upload-box small,.form-hint{color:var(--muted);font-size:.85rem}.upload-box span{font-size:.8rem;color:var(--muted)}
.photo-preview{margin-top:14px;border-radius:18px;overflow:hidden;background:#dfe8dd;min-height:0}
.photo-preview img{display:block;width:100%;max-height:420px;object-fit:cover}
.record-submit{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px;border-radius:22px;background:var(--ink);color:#fff}
.record-submit small{display:block;color:#cdd9d2;margin-top:4px}
.record-submit .primary{background:#fff;color:var(--ink)}
.record-toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}
.record-list{display:grid;gap:14px}
.record-card{display:grid;grid-template-columns:220px 1fr;background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.record-card>img,.record-no-photo{width:100%;height:100%;min-height:220px;object-fit:cover;background:linear-gradient(135deg,#dfe8dd,#c9d8d2);display:grid;place-items:center;font-size:2rem}
.record-card-body{padding:22px}.record-card-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.78rem;color:var(--muted)}
.record-card h2{font-size:2rem;margin:12px 0 5px}.record-card p{color:var(--muted)}
.record-meta{display:flex;justify-content:space-between;gap:15px;align-items:center;border-top:1px solid var(--line);padding-top:14px;margin-top:18px;font-size:.8rem}
.empty-records{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:45px;text-align:center}.empty-records>span{font-size:3rem}.empty-records p{color:var(--muted)}

.review-header h2{margin:10px 0}.review-header p{color:var(--muted)}
