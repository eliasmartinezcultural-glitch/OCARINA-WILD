<header class="hero"><div class="hero-in"><div class="eyebrow">OCARINA WILD · San Patricio del Chañar</div><h1>EL CHÁÑAR<br>VIVO.</h1><p>Una guía para mirar, reconocer y entender la naturaleza que nos rodea. Pensada para escuelas, familias, curiosos y gente de acá.</p><div class="mini">Agua · monte · chacras · cielo · vida silvestre</div></div></header>

<main class="wrap">
<section class="intro"><div><div class="eyebrow" style="color:var(--accent)">Entrá por una puerta</div><h2>No es una enciclopedia.<br>Es para descubrir.</h2></div><p>La portada queda corta. La profundidad aparece al tocar una especie, completar una misión o abrir una fuente. La información local y la regional nunca se mezclan.</p></section>


<section class="explore" id="explorer">
<div class="scene"><div class="scene-copy"><div class="eyebrow">UNA MISMA TIERRA · MUCHAS CAPAS</div><h3 id="sceneTitle">El agua abre el paisaje.</h3><p id="sceneText">Entrá por un ambiente y descubrí qué vida, rastros, sonidos y preguntas aparecen alrededor.</p></div></div>
<div>
<div class="eyebrow" style="color:var(--accent);margin:5px 0 10px">Elegí qué mirar</div>

</div>
</section>

<section class="section"><div class="section-head"><div><h2>Profundizar sin perderse</h2><p>La información pesada aparece solamente cuando hace falta.</p></div></div>
<div class="legal"><article><h3>🟢 Evidencia</h3><p>Local, regional, candidata o pendiente. WILD muestra qué sabemos y qué todavía necesitamos comprobar.</p></article><article><h3>👁 Reconocer</h3><p>Forma, color, comportamiento, ambiente y pistas sencillas para aprender a identificar.</p></article><article><h3>🎧 Escuchar</h3><p>La próxima capa incorporará sonidos y cantos como otra puerta de entrada.</p></article><article><h3>🧭 Relacionar</h3><p>Una especie nunca aparece sola: agua, plantas, alimento, refugio y otras especies forman una red.</p></article></div></section><section class="section"><div class="section-head"><div><h2>Valores de WILD</h2><p>Lo que guía cada ficha y cada misión.</p></div></div><div class="values">
<div class="value"><strong>Mirar</strong><span>Antes de afirmar, observar.</span></div><div class="value"><strong>Cuidar</strong><span>La vida silvestre no se molesta.</span></div><div class="value"><strong>Preguntar</strong><span>La duda también es conocimiento.</span></div><div class="value"><strong>Probar</strong><span>Una observación puede abrir una investigación.</span></div><div class="value"><strong>Compartir</strong><span>El conocimiento local también es patrimonio.</span></div>
</div></section>

<section class="section" id="marco"><div class="section-head"><div><h2>Marco real</h2><p>Una capa documental sencilla para saber de dónde sale cada cosa.</p></div></div><div class="legal">
<article><h3>Ley 25.675 · Ambiente</h3><p>Fija presupuestos mínimos para la gestión ambiental, conservación de la diversidad biológica, educación, información y participación.</p><a href="https://www.argentina.gob.ar/normativa/nacional/79980/texto" target="_blank">Ver norma oficial →</a></article>
<article><h3>Ley 22.421 · Fauna</h3><p>Declara de interés público la fauna silvestre y establece el marco nacional para su protección, conservación y aprovechamiento racional.</p><a href="https://www.argentina.gob.ar/normativa/nacional/38116/actualizacion" target="_blank">Ver norma oficial →</a></article>
<article><h3>Ley 26.331 · Bosques nativos</h3><p>Establece presupuestos mínimos para conservación, restauración y manejo sostenible de los bosques nativos y sus servicios ambientales.</p><a href="https://www.argentina.gob.ar/normativa/nacional/ley-26331-136125/texto" target="_blank">Ver norma oficial →</a></article>
<article><h3>Ley 27.621 · Educación Ambiental Integral</h3><p>Convierte la educación ambiental integral en una política pública y promueve conocimientos, valores, participación y vínculo con los territorios.</p><a href="https://www.argentina.gob.ar/normativa/nacional/ley-27621-350594/texto" target="_blank">Ver norma oficial →</a></article>
<article><h3>Neuquén · Ley 2594</h3><p>Marco provincial del Sistema de Áreas Naturales Protegidas. Se suma a la normativa ambiental provincial, incluida la Ley 1875.</p><a href="https://ambiente.neuquen.gov.ar/subsecretaria-de-cambio-climatico/repositorios/normativa-provincial/" target="_blank">Repositorio provincial →</a></article>
<article><h3>Dique Compensador El Chañar</h3><p>La Municipalidad informa que fue declarado Área Natural Protegida Municipal en octubre de 2006 para conservar y preservar su ecosistema.</p><a href="https://sanpatricio.gob.ar/nuestra" target="_blank">Fuente municipal →</a></article>
</div></section>

<section class="section"><div class="section-head"><div><h2>Regla de evidencia</h2><p>WILD separa tres cosas que suelen confundirse.</p></div></div><div class="legal">
<article><h3>Registro local</h3><p>Hay una fuente que permite vincular la especie con Chañar o un sitio puntual de la localidad.</p></article>
<article><h3>Imagen</h3><p>Una foto sirve para reconocer. No prueba por sí sola que ese ejemplar haya sido fotografiado en Chañar.</p></article>
<article><h3>Contexto regional</h3><p>Una especie puede ser propia de la estepa o de Neuquén y aun así necesitar una comprobación local antes de presentarla como “de Chañar”.</p></article>
<article><h3>Fuente abierta</h3><p>Las fichas enlazan a SIB, Municipalidad, normativa oficial y repositorios públicos para que una escuela pueda seguir investigando.</p></article>
</div></section>

function mission(n,t){document.getElementById('panel').innerHTML='<button class="close" onclick="closeModal()">×</button><div class="panel-in"><span class="tag">Misión '+n+'</span><h2>'+t+'</h2><p>'+missions.find(m=>m[0]===n)[2]+'</p><div class="facts"><div class="fact"><b>Regla</b>No capturar, alimentar ni perseguir animales.</div><div class="fact"><b>Resultado</b>Una observación breve, clara y respetuosa.</div></div><button class="filter" onclick="closeModal();toast(\'Misión iniciada. Mirá primero.\')">EMPEZAR</button></div>';document.getElementById('modal').classList.add('show')}
function go(id){document.getElementById(id).scrollIntoView({behavior:'smooth'})}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.getElementById('search').addEventListener('input',e=>{let q=e.target.value.toLowerCase();document.querySelectorAll('.card').forEach(c=>c.style.display=c.dataset.name.includes(q)?'block':'none')});
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{if(!b.dataset.f)return;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');let f=b.dataset.f;document.querySelectorAll('.card').forEach(c=>c.style.display=(f==='todos'||c.dataset.status===f)?'block':'none')}));
render();

const habitats=[
{n:'AGUA',t:'El agua abre el paisaje.',d:'Dique, río, juncales y bordes húmedos concentran señales de vida.',q:'¿Qué formas de vida aparecen donde hay agua?',img:'https://commons.wikimedia.org/wiki/Special:FilePath/Dique%20Compensador%20Cha%C3%B1ar%2C%20Neuquen%20-%20panoramio%20%282%29.jpg'},
{n:'CHACRAS',t:'El riego también construye hábitat.',d:'Canales, cultivos, árboles y bordes productivos crean un mosaico distinto.',q:'¿Qué especies podrían usar los bordes de una chacra?',img:'https://commons.wikimedia.org/wiki/Special:FilePath/Chacras%20San%20Patricio%20del%20Cha%C3%B1ar.jpg'},
{n:'MONTE',t:'La vida aprende a vivir con poco.',d:'Arbustos, suelo desnudo, viento y sequedad forman otro mundo.',q:'¿Qué adaptación ayuda a una planta a perder menos agua?',img:'https://commons.wikimedia.org/wiki/Special:FilePath/Monte%20Patag%C3%B3nico.jpg'},
{n:'CIELO',t:'Arriba también hay territorio.',d:'El vuelo, la silueta y el sonido permiten reconocer aves sin capturarlas.',q:'¿Qué diferencia una rapaz de un ave pequeña en vuelo?',img:'https://commons.wikimedia.org/wiki/Special:FilePath/Geranoaetus%20polyosoma%20201699947.jpg'}
];
const detail={
chanar:{mirar:'Copa abierta, ramas espinosas y pequeñas hojas.',habitat:'Monte, bordes y ambientes secos; también aparece en áreas intervenidas.',rastro:'Frutos y presencia de brotes o pequeños bosquecillos.',relacion:'Ofrece alimento y refugio; forma parte del paisaje que da nombre al lugar.',evidence:'Especie autóctona documentada para la región. La presencia puntual en cada sitio debe observarse y registrarse.'},
cisne:{mirar:'Cuerpo blanco, cabeza y cuello negros con carúncula roja.',habitat:'Cuerpos de agua, lagunas y ambientes acuáticos.',rastro:'Presencia sobre el agua y alimentación de vegetación acuática.',relacion:'Conecta la calidad del ambiente acuático con la observación de aves.',evidence:'Existe registro publicado vinculado al Dique Compensador El Chañar.'},
ataj:{mirar:'Ave discreta, actividad crepuscular y nocturna.',habitat:'Estepas, matorrales, claros y sectores abiertos.',rastro:'Se detecta mejor por actividad al anochecer que por búsqueda directa.',relacion:'Controla insectos al capturarlos en vuelo.',evidence:'Existe cita SIB de 2017 vinculada al sector del Dique.'},
osprey:{mirar:'Rapaz grande asociada al agua y especializada en peces.',habitat:'Grandes cuerpos de agua.',rastro:'Vuelo sobre el agua y posibles zambullidas de pesca.',relacion:'Es un indicador visual de la conexión entre agua y fauna.',evidence:'La investigación acumulada incluye registro científico para Dique El Chañar.'}
};
const questions=habitats.map(x=>x.q);let qi=0;
function setupExplorer(){
document.getElementById('hotspots').innerHTML=habitats.map((x,i)=>'<button class="hotspot" onclick="showHabitat('+i+')"><span>0'+(i+1)+'</span><strong>'+x.n+'</strong><span>'+x.d+'</span></button>').join('');
document.getElementById('trail').innerHTML=habitats.map((x,i)=>'<button onclick="showHabitat('+i+')">'+x.n+'</button>').join('');
}
function showHabitat(i){let x=habitats[i];document.querySelector('.scene').style.backgroundImage="linear-gradient(0deg,#102018dd,#10201818 65%),url('"+x.img+"')";document.getElementById('sceneTitle').textContent=x.t;document.getElementById('sceneText').textContent=x.d;document.getElementById('fieldQuestion').textContent=x.q;document.querySelectorAll('#trail button').forEach((b,j)=>b.classList.toggle('active',j===i));}
function nextQuestion(){qi=(qi+1)%questions.length;document.getElementById('fieldQuestion').textContent=questions[qi];}
const oldOpenItem=openItem;
openItem=function(id){let x=items.find(i=>i.id===id),d=detail[id]||{};document.getElementById('panel').innerHTML='<button class="close" onclick="closeModal()">×</button><img src="'+x.img+'"><div class="panel-in"><span class="tag">'+x.tag+'</span><h2>'+x.name+'</h2><div class="latin">'+x.latin+'</div><div class="trail"><button class="active">MIRAR</button><button>HÁBITAT</button><button>RASTRO</button><button>RELACIÓN</button><button>EVIDENCIA</button></div><div class="deep"><button><b>Mirar</b>'+ (d.mirar||'Observar rasgos que ayuden a reconocer.') +'</button><button><b>Hábitat</b>'+ (d.habitat||'Ambiente todavía en investigación local.') +'</button><button><b>Rastro</b>'+ (d.rastro||'Buscar señales sin alterar el ambiente.') +'</button><button><b>Relación</b>'+ (d.relacion||'Pensar qué otras especies y recursos se relacionan.') +'</button></div><div class="facts">'+x.facts.map((f,i)=>'<div class="fact"><b>Dato '+(i+1)+'</b>'+f+'</div>').join('')+'</div><p>'+x.desc+'</p><div class="sourcebox"><b>Qué sabemos:</b> '+(d.evidence||'Esta ficha requiere seguir incorporando evidencia local.')+'</div><p><b>Fuente:</b> <a href="'+x.src+'" target="_blank">consultar ficha pública →</a></p></div>';document.getElementById('modal').classList.add('show')};
setupExplorer();showHabitat(0);
</script>
