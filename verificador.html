<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCARINA WILD · Verificador</title>
<style>
body{margin:0;background:#f5f1e8;color:#17342b;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}.hero{padding:45px 0 25px}.hero h1{font-size:clamp(2.6rem,7vw,5rem);line-height:.9;margin:10px 0}.muted{color:#68766f}.panel{background:#fffdf8;border:1px solid #d8d2c6;border-radius:22px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.ok{background:#e4efe6}.warn{background:#f5ead5}.bad{background:#f3dddd}.stat{font-size:2rem;font-weight:900}.item{padding:12px 0;border-top:1px solid #d8d2c6}.item:first-child{border-top:0}.thumb{width:120px;height:90px;object-fit:contain;background:#e5ece5;border-radius:12px;float:right}.btn{border:0;border-radius:999px;background:#17342b;color:#fff;padding:12px 17px;font-weight:800;cursor:pointer}.clear{clear:both}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}.thumb{width:90px;height:70px}}
</style></head><body><main class="wrap"><section class="hero"><span>OCARINA WILD · CONTROL DE CALIDAD</span><h1>VERIFICADOR WILD</h1><p class="muted">Chequeo visual y estructural del banco de especies. Esta herramienta no reemplaza la revisión científica humana.</p><button class="btn" id="run">Ejecutar chequeo</button></section><section id="summary" class="grid"></section><section class="panel"><h2>Alertas</h2><div id="alerts">Ejecutando…</div></section></main><script src="./data.js"></script><script>
const D=window.WILD_DATA,summary=document.querySelector("#summary"),alerts=document.querySelector("#alerts");
function run(){
 const errors=[],warnings=[],items=[];
 const ids=new Set(),envs=new Set((D.environments||[]).map(x=>x.id));
 for(const s of D.species||[]){
  if(ids.has(s.id))errors.push(s.commonName+": ID duplicado");ids.add(s.id);
  for(const k of ["commonName","scientificName","image","imageSourceUrl","description","identification","habitat","behavior","diet","reproduction","conservation","localNote"])if(!s[k])errors.push(s.commonName+": falta "+k);
  for(const e of s.environments||[])if(!envs.has(e))errors.push(s.commonName+": ambiente inexistente "+e);
  const genus=(s.scientificName||"").split(/[ .·]/)[0].toLowerCase().replace(/[^a-z]/g,"");
  const species=(s.scientificName||"").split(/[ .·]/)[1]?.toLowerCase().replace(/[^a-z]/g,"")||"";
  const file=decodeURIComponent(s.image||"").split("/").pop().toLowerCase().replace(/[^a-z]/g,"");
  const expected=(genus+species);
  if(genus && !file.includes(genus))warnings.push(s.commonName+": la imagen no coincide de forma evidente con el género esperado ("+genus+").");
  if((s.scientificName||"").includes("pendiente"))warnings.push(s.commonName+": identificación taxonómica pendiente; no usar una foto de especie concreta sin aclaración.");
  items.push({s,genus,species,file,expected});
 }
 summary.innerHTML='<article class="panel '+(errors.length?'bad':'ok')+'"><div class="stat">'+errors.length+'</div>Errores estructurales</article><article class="panel '+(warnings.length?'warn':'ok')+'"><div class="stat">'+warnings.length+'</div>Alertas de revisión</article><article class="panel ok"><div class="stat">'+items.filter(x=>x.s.image).length+'/'+items.length+'</div>Especies con foto</article>';
 let out="";
 for(const e of errors)out+='<div class="item">❌ '+e+'</div>';
 for(const w of warnings)out+='<div class="item">⚠️ '+w+'</div>';
 out+='<h3>Chequeo específico de fotografías</h3>';
 for(const x of items){
  const id=x.s.id, label=x.s.commonName;
  out+='<div class="item" id="i-'+id+'"><img class="thumb" src="'+x.s.image+'" alt="'+label+'" onload="this.nextElementSibling.textContent='Foto cargada · URL OK'" onerror="this.nextElementSibling.textContent='ERROR · imagen no carga'"><b>'+label+'</b><br><span class="muted">Espera taxonómica: '+x.s.scientificName+' · Archivo: '+x.file+'</span><br><span class="status">Comprobando foto…</span><div class="clear"></div></div>';
 }
 if(!errors.length&&!warnings.length)out='<div class="item">✅ No hay alertas automáticas. Las imágenes siguen requiriendo revisión visual humana para confirmar que el ejemplar mostrado sea realmente la especie indicada.</div>'+out;
 alerts.innerHTML=out;
}
document.querySelector("#run").onclick=run;run();
</script></body></html>
