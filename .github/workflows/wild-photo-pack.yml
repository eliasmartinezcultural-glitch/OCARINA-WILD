name: WILD photo pack
on:
  push:
    paths:
      - 'data.js'
      - '.github/workflows/wild-photo-pack.yml'
permissions:
  contents: write
jobs:
  pack-photos:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and normalize every approved photo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/wild
          python3 - <<'PY'
          import re, urllib.parse, pathlib, subprocess
          p=pathlib.Path("data.js")
          s=p.read_text(encoding="utf-8")
          pairs=re.findall(r'"id"\s*:\s*"([^"]+)"[\s\S]*?"image"\s*:\s*"([^"]+)"', s)
          ok=0
          for sid,url in pairs:
              out=pathlib.Path("assets/wild")/(sid+".jpg")
              proxy="https://images.weserv.nl/?url="+urllib.parse.quote(url,safe="")+"&w=1600&h=1200&fit=contain&cbg=07150e&q=92&output=jpg"
              r=subprocess.run(["curl","-L","--fail","--silent","--show-error","--retry","3","-A","Mozilla/5.0 OCARINA-WILD","-o",str(out),proxy])
              if r.returncode==0 and out.exists() and out.stat().st_size>5000:
                  s=s.replace('"image": "'+url+'"','"image": "assets/wild/'+sid+'.jpg"',1)
                  ok+=1
                  print("OK",sid,out.stat().st_size)
              else:
                  if out.exists(): out.unlink()
                  print("FAIL",sid)
          p.write_text(s,encoding="utf-8")
          print("LOCAL_PHOTOS",ok,"/",len(pairs))
          if ok < len(pairs):
              raise SystemExit("Not all approved photos could be packed locally")
          PY
      - name: Commit local photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/wild data.js
          git diff --cached --quiet && exit 0
          git commit -m "WILD: store all approved species photos locally"
          git push
